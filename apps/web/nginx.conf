# Nginx de la web: sirve el build de Vite y redirige /api al servicio api de docker compose.
# Así el navegador usa un solo origen (igual que el proxy de Vite en desarrollo) y no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: sin URI en proxy_pass, así se conserva el prefijo /api que espera NestJS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché con "expires" y no con add_header: un add_header dentro de una location anula
    # los encabezados de seguridad heredados del bloque server.

    # Archivos con hash en el nombre (Vite): se pueden cachear sin límite.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del cliente (/comite/5, /creditos?cedula=…) devuelve index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
